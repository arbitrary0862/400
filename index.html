<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>楓之谷 女神400 速解工具</title>
  <style>
    :root {
      --bg: #12151c;
      --card: #1c212c;
      --border: #2e3646;
      --text: #e6edf3;
      --muted: #8b949e;
      --primary: #3b82f6;
      --accent: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 520px; }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .row:last-child { margin-bottom: 0; }
    .label { font-weight: bold; font-size: 1.1rem; width: 90px; }
    .label span { display: block; font-size: 0.75rem; color: var(--muted); font-weight: normal; }
    .btn-group { display: flex; gap: 8px; flex: 1; }
    button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #252b38;
      color: var(--text);
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
    }
    button:hover { border-color: var(--primary); }
    button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .reset-btn {
      width: 100%;
      margin-top: 12px;
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--danger);
      color: #fca5a5;
    }
    .reset-btn:hover { background: var(--danger); color: #fff; }
    .result-box { text-align: center; }
    .result-title { font-size: 0.9rem; color: var(--muted); margin-bottom: 8px; }
    .solution-item {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 6px;
      color: #6ee7b7;
    }
    .solution-sub {
      font-size: 0.85rem;
      letter-spacing: normal;
      color: var(--text);
      margin-top: 4px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: center; }
    th, td { padding: 8px 4px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); }
    tr.highlight { background: rgba(59, 130, 246, 0.2); }
    tr.dim { opacity: 0.35; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗼 女神之塔 400 速解工具</h1>

    <!-- 輸入區 -->
    <div class="card">
      <div class="row" data-key="a">
        <div class="label">A <span>(0, 0, 0)</span></div>
        <div class="btn-group">
          <button onclick="selectVal('a', 0)">0</button>
          <button onclick="selectVal('a', 1)">1</button>
          <button onclick="selectVal('a', 2)">2</button>
        </div>
      </div>
      <div class="row" data-key="b">
        <div class="label">B <span>(1, 0, 0)</span></div>
        <div class="btn-group">
          <button onclick="selectVal('b', 0)">0</button>
          <button onclick="selectVal('b', 1)">1</button>
          <button onclick="selectVal('b', 2)">2</button>
        </div>
      </div>
      <div class="row" data-key="c">
        <div class="label">C <span>(0, 1, 0)</span></div>
        <div class="btn-group">
          <button onclick="selectVal('c', 0)">0</button>
          <button onclick="selectVal('c', 1)">1</button>
          <button onclick="selectVal('c', 2)">2</button>
        </div>
      </div>
      <div class="row" data-key="d">
        <div class="label">D <span>(0, 0, 1)</span></div>
        <div class="btn-group">
          <button onclick="selectVal('d', 0)">0</button>
          <button onclick="selectVal('d', 1)">1</button>
          <button onclick="selectVal('d', 2)">2</button>
        </div>
      </div>
      <button class="reset-btn" onclick="resetAll()">🔄 重置 (下一場)</button>
    </div>

    <!-- 解答顯示區 -->
    <div class="card result-box">
      <div class="result-title" id="status-text">請依序點擊 NPC 回報的正確數量</div>
      <div id="solutions"></div>
    </div>

    <!-- 完整對照表 -->
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>A</th><th>B</th><th>C</th><th>D</th><th>解答 (左 - 中 - 右)</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    // 完整 15 組對照表資料
    const DATA = [
      { a: 0, b: 0, c: 1, d: 1, ans: [2, 1, 1] },
      { a: 0, b: 1, c: 0, d: 1, ans: [1, 2, 1] },
      { a: 0, b: 1, c: 1, d: 0, ans: [1, 1, 2] },
      { a: 1, b: 0, c: 1, d: 1, ans: [0, 2, 2] },
      { a: 1, b: 0, c: 1, d: 2, ans: [0, 3, 1] },
      { a: 1, b: 0, c: 2, d: 1, ans: [0, 1, 3] },
      { a: 1, b: 1, c: 0, d: 1, ans: [2, 0, 2] },
      { a: 1, b: 1, c: 0, d: 2, ans: [3, 0, 1] },
      { a: 1, b: 1, c: 1, d: 0, ans: [2, 2, 0] },
      { a: 1, b: 1, c: 2, d: 0, ans: [3, 1, 0] },
      { a: 1, b: 2, c: 0, d: 1, ans: [1, 0, 3] },
      { a: 1, b: 2, c: 1, d: 0, ans: [1, 3, 0] },
      { a: 2, b: 1, c: 1, d: 2, ans: [0, 0, 4] },
      { a: 2, b: 1, c: 2, d: 1, ans: [0, 4, 0] },
      { a: 2, b: 2, c: 1, d: 1, ans: [4, 0, 0] }
    ];

    let state = { a: null, b: null, c: null, d: null };

    function selectVal(key, val) {
      // 再次點擊同按鈕則取消選取
      state[key] = (state[key] === val) ? null : val;
      updateUI();
    }

    function resetAll() {
      state = { a: null, b: null, c: null, d: null };
      updateUI();
    }

    function updateUI() {
      // 更新按鈕狀態
      ['a', 'b', 'c', 'd'].forEach(key => {
        const buttons = document.querySelectorAll(`.row[data-key="${key}"] button`);
        buttons.forEach(btn => {
          btn.classList.toggle('active', Number(btn.textContent) === state[key]);
        });
      });

      // 篩選符合條件的組合
      const hasInput = Object.values(state).some(v => v !== null);
      const matches = DATA.filter(item =>
        (state.a === null || item.a === state.a) &&
        (state.b === null || item.b === state.b) &&
        (state.c === null || item.c === state.c) &&
        (state.d === null || item.d === state.d)
      );

      // 渲染結果區
      const statusEl = document.getElementById('status-text');
      const solEl = document.getElementById('solutions');
      solEl.innerHTML = '';

      if (!hasInput) {
        statusEl.textContent = '請依序點擊 NPC 回報的正確數量';
      } else if (matches.length === 0) {
        statusEl.textContent = '❌ 查無符合組合，請檢查是否按錯數字';
      } else if (matches.length === 1) {
        statusEl.textContent = '✅ 已鎖定唯一解答！';
        renderSolutionCard(matches[0].ans, solEl);
      } else {
        statusEl.textContent = `🔍 剩餘 ${matches.length} 種可能組合（請繼續輸入下一項）：`;
        matches.forEach(m => renderSolutionCard(m.ans, solEl));
      }

      // 渲染底部對照表
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = DATA.map(item => {
        const isMatch = matches.includes(item);
        const rowClass = !hasInput ? '' : (isMatch ? 'highlight' : 'dim');
        return `<tr class="${rowClass}">
          <td>${item.a}</td><td>${item.b}</td><td>${item.c}</td><td>${item.d}</td>
          <td><strong>${item.ans.join(' - ')}</strong></td>
        </tr>`;
      }).join('');
    }

    function renderSolutionCard(ans, container) {
      const div = document.createElement('div');
      div.className = 'solution-item';
      div.innerHTML = `${ans[0]} - ${ans[1]} - ${ans[2]}
        <div class="solution-sub">左台 ${ans[0]} 人 ｜ 中台 ${ans[1]} 人 ｜ 右台 ${ans[2]} 人</div>`;
      container.appendChild(div);
    }

    updateUI();
  </script>
</body>
</html>
