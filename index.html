<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>楓之谷 女神400 速解工具</title>
  <style>
    body {
      background: #12151c;
      color: #e6edf3;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center
    }

    .wrap {
      width: 100%;
      max-width: 480px
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin: 0 0 14px
    }

    .card {
      background: #1c212c;
      border: 1px solid #2e3646;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px
    }

    .row {
      display: flex;
      align-items: center;
      margin-bottom: 10px
    }

    .lbl {
      width: 85px;
      font-weight: bold
    }

    .lbl small {
      display: block;
      color: #8b949e;
      font-weight: normal;
      font-size: .75rem
    }

    .btns {
      display: flex;
      gap: 8px;
      flex: 1
    }

    button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #2e3646;
      background: #252b38;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer
    }

    button.on {
      background: #3b82f6;
      border-color: #3b82f6
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .85rem;
      color: #8b949e;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #2e3646
    }

    select {
      background: #252b38;
      color: #fff;
      border: 1px solid #2e3646;
      border-radius: 6px;
      padding: 4px 8px
    }

    .rst {
      width: 100%;
      margin-top: 10px;
      background: rgba(239, 68, 68, .15);
      border-color: #ef4444;
      color: #fca5a5
    }

    .res {
      text-align: center
    }

    .st {
      font-size: .9rem;
      color: #8b949e;
      margin-bottom: 8px
    }

    .sol {
      background: rgba(16, 185, 129, .15);
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 5px;
      color: #6ee7b7;
      cursor: pointer
    }

    .sol div {
      font-size: .8rem;
      letter-spacing: normal;
      color: #e6edf3;
      margin-top: 4px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
      text-align: center
    }

    th,
    td {
      padding: 6px;
      border-bottom: 1px solid #2e3646
    }

    th {
      color: #8b949e
    }

    tr.hi {
      background: rgba(59, 130, 246, .22)
    }

    tr.dim {
      opacity: .3
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: #06281e;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 99px;
      opacity: 0;
      transition: .2s;
      pointer-events: none
    }

    .toast.show {
      opacity: 1
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>🗼 女神之塔 400 速解工具</h1>
    <div class="card">
      <div id="inputs"></div>
      <div class="bar">
        <span>📋 複製格式：</span>
        <select id="fmt">
          <option value="code">純數字 (例: 211)</option>
          <option value="dash">橫線分隔 (例: 2-1-1)</option>
          <option value="detail">完整提示 (例: 211 左2中1右1)</option>
        </select>
      </div>
      <button class="rst" onclick="rst()">🔄 重置 (下一場)</button>
    </div>
    <div class="card res">
      <div class="st" id="st">請依序點擊 NPC 回報的正確數量</div>
      <div id="sols"></div>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>A</th>
            <th>B</th>
            <th>C</th>
            <th>D</th>
            <th>解答 (左-中-右)</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const ROWS = [['a', 'A', '(0,0,0)'], ['b', 'B', '(1,0,0)'], ['c', 'C', '(0,1,0)'], ['d', 'D', '(0,0,1)']];
    const DATA = [
      [0, 0, 1, 1, 2, 1, 1], [0, 1, 0, 1, 1, 2, 1], [0, 1, 1, 0, 1, 1, 2],
      [1, 0, 1, 1, 0, 2, 2], [1, 0, 1, 2, 0, 3, 1], [1, 0, 2, 1, 0, 1, 3],
      [1, 1, 0, 1, 2, 0, 2], [1, 1, 0, 2, 3, 0, 1], [1, 1, 1, 0, 2, 2, 0],
      [1, 1, 2, 0, 3, 1, 0], [1, 2, 0, 1, 1, 0, 3], [1, 2, 1, 0, 1, 3, 0],
      [2, 1, 1, 2, 0, 0, 4], [2, 1, 2, 1, 0, 4, 0], [2, 2, 1, 1, 4, 0, 0]
    ];
    let S = {a: null, b: null, c: null, d: null}, last = '', tm;
    document.getElementById('inputs').innerHTML = ROWS.map(([k, t, s]) =>
      `<div class="row" id="r-${k}"><div class="lbl">${t}<small>${s}</small></div><div class="btns">` +
      [0, 1, 2].map(v => `<button onclick="sel('${k}',${v})">${v}</button>`).join('') + `</div></div>`
    ).join('');
    function sel(k, v) {S[k] = S[k] === v ? null : v; render()}
    function rst() {S = {a: null, b: null, c: null, d: null}; last = ''; render()}
    function cp(a, auto = false) {
      const m = document.getElementById('fmt').value;
      const txt = m === 'dash' ? a.join('-') : m === 'detail' ? `${a.join('')} (左${a[0]}中${a[1]}右${a[2]})` : a.join('');
      if (auto && txt === last) return; if (auto) last = txt;
      navigator.clipboard?.writeText(txt).catch(() => { });
      const t = document.getElementById('toast');
      t.textContent = `📋 已${auto ? '自動' : ''}複製：${txt}`;
      t.classList.add('show'); clearTimeout(tm); tm = setTimeout(() => t.classList.remove('show'), 2000);
    }
    function render() {
      ROWS.forEach(([k]) => document.querySelectorAll(`#r-${k} button`).forEach((b, i) => b.classList.toggle('on', S[k] === i)));
      const has = Object.values(S).some(v => v !== null);
      const m = DATA.filter(d => (S.a === null || d[0] === S.a) && (S.b === null || d[1] === S.b) && (S.c === null || d[2] === S.c) && (S.d === null || d[3] === S.d));
      const st = document.getElementById('st'), sols = document.getElementById('sols');
      sols.innerHTML = '';
      if (!has) st.textContent = '請依序點擊 NPC 回報的正確數量';
      else if (!m.length) st.textContent = '❌ 查無符合組合，請檢查是否按錯';
      else if (m.length === 1) {
        const a = m[0].slice(4);
        st.textContent = '✅ 已鎖定唯一解答（已自動複製）！';
        sols.innerHTML = card(a); cp(a, true);
      } else {
        last = ''; st.textContent = `🔍 剩餘 ${m.length} 種可能（點擊卡片複製）：`;
        sols.innerHTML = m.map(d => card(d.slice(4))).join('');
      }
      document.getElementById('tb').innerHTML = DATA.map(d => {
        const cls = !has ? '' : m.includes(d) ? 'hi' : 'dim';
        return `<tr class="${cls}"><td>${d[0]}</td><td>${d[1]}</td><td>${d[2]}</td><td>${d[3]}</td><td><b>${d.slice(4).join(' - ')}</b></td></tr>`;
      }).join('');
    }
    function card(a) {
      return `<div class="sol" onclick="cp([${a}])">${a.join(' - ')}<div>左台 ${a[0]} 人 ｜ 中台 ${a[1]} 人 ｜ 右台 ${a[2]} 人（點擊複製）</div></div>`;
    }
    render();
  </script>
</body>

</html>
